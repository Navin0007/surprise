<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Be My Valentine? 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background hearts container -->
    <div id="hearts-container"></div>

    <!-- Main container -->
    <div class="container">
        <!-- Question screen -->
        <div id="question" class="screen active">
            <div class="valentine-image">
                <h2 class="queen-greeting">Hi ! Queen</h2>
                <p class="will-you-be">WILL YOU BE MY</p>
                <h1 class="valentine-gradient">valentine?</h1>
            </div>
            
            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">😊💕 Yes! 💕</button>
                <button id="noBtn" class="btn btn-no">💔 No 💔</button>
            </div>
        </div>

        <!-- Celebration screen -->
        <div id="celebration" class="screen celebration">
            <div class="emoji celebration-emoji">🎉</div>
            <h2 class="celebration-title">Yay! You said YES! 💕</h2>
            <div id="photo-gallery" class="photo-gallery">
                <!-- Images will be dynamically loaded here -->
            </div>
            <p class="love-message">
                You just made me the happiest person alive! 
                Can't wait to spend Valentine's Day with you! 💖✨
            </p>
            <div class="emoji celebration-emoji-bottom">😍</div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js" type="module"></script>
</body>
</html>
