<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Be My Valentine? 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background hearts container -->
    <div id="hearts-container"></div>

    <!-- Main container -->
    <div class="container">
        <!-- Question screen -->
        <div id="question" class="screen active">
            <div class="valentine-image">
                <h2 class="queen-greeting">Hi ! Queen</h2>
                <p class="will-you-be">WILL YOU BE MY</p>
                <h1 class="valentine-gradient">valentine?</h1>
            </div>
            
            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">😊💕 Yes! 💕</button>
                <button id="noBtn" class="btn btn-no">💔 No 💔</button>
            </div>
        </div>

        <!-- Celebration screen - Dynamic Motion Pages -->
        <div id="celebration" class="screen celebration">
            <div id="motion-pages-container" class="motion-pages-container">
                <!-- Dynamic pages with images and lyrics will be loaded here -->
            </div>
            <div class="page-indicator">
                <span id="current-page">1</span> / <span id="total-pages">5</span>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js" type="module"></script>
</body>
</html>
